<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кухня-гостиная | ЖК Акватория</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; overflow: hidden; }
        
        #container { width: 100vw; height: 100vh; position: relative; }
        #panorama { width: 100%; height: 100%; }
        
        /* Прелоадер */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 60px; height: 60px; border: 4px solid #333;
            border-top-color: #fff; border-radius: 50%;
            animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader p { margin-top: 20px; font-size: 18px; color: #ccc; }
        
        /* Навигация */
        #nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 100; background: rgba(0,0,0,0.7);
            padding: 12px 25px; border-radius: 30px; backdrop-filter: blur(10px);
        }
        .nav-btn {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid white;
            background: transparent; color: white; font-size: 24px; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: white; color: black; transform: scale(1.1); }
        
        /* Индикатор ракурса */
        #scene-indicator {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 12px 30px; border-radius: 25px;
            font-size: 18px; z-index: 100; backdrop-filter: blur(10px);
        }
        
        /* Кнопка меню */
        #menu-btn {
            position: fixed; top: 30px; right: 30px; width: 50px; height: 50px;
            border-radius: 50%; border: 2px solid white; background: rgba(0,0,0,0.7);
            color: white; font-size: 24px; cursor: pointer; z-index: 100;
            transition: all 0.3s ease; backdrop-filter: blur(10px);
        }
        #menu-btn:hover { background: white; color: black; }
        
        /* Меню */
        #menu {
            position: fixed; top: 50%; right: 30px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; z-index: 99;
        }
        .menu-btn {
            padding: 12px 20px; border-radius: 25px; border: 2px solid white;
            background: rgba(0,0,0,0.7); color: white; cursor: pointer;
            transition: all 0.3s ease; font-size: 14px; backdrop-filter: blur(10px);
        }
        .menu-btn:hover { background: white; color: black; }
        .menu-btn.active { background: white; color: black; }
        
        /* Подсказка */
        #hint {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 12px 25px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s ease; z-index: 99;
        }
        #hint.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p>Загрузка панорамы...</p>
    </div>
    
    <div id="container">
        <div id="panorama"></div>
    </div>
    
    <div id="scene-indicator">Ракурс 1 из 4</div>
    
    <button id="menu-btn">☰</button>
    
    <div id="menu" style="display: none;">
        <button class="menu-btn active" onclick="loadScene(0)">📍 Ракурс 1</button>
        <button class="menu-btn" onclick="loadScene(1)">📍 Ракурс 2</button>
        <button class="menu-btn" onclick="loadScene(2)">📍 Ракурс 3</button>
        <button class="menu-btn" onclick="loadScene(3)">📍 Ракурс 4</button>
    </div>
    
    <div id="nav">
        <button class="nav-btn" onclick="prevScene()">◀</button>
        <button class="nav-btn" onclick="nextScene()">▶</button>
    </div>
    
    <div id="hint"></div>

    <script>
        // Данные сцены
        const scenes = [
            { 
                href: '360_001_0000.jpg',
                title: 'Ракурс 1',
                pitch: 0,
                yaw: 0,
                hotSpots: [
                    { pitch: -5, yaw: 90, hotspotText: 'Следующий ракурс ▶' },
                    { pitch: -5, yaw: -90, hotspotText: 'Предыдущий ракурс ◀' }
                ]
            },
            { 
                href: '360_002_0000.jpg',
                title: 'Ракурс 2',
                pitch: 0,
                yaw: 90,
                hotSpots: [
                    { pitch: -5, yaw: 90, hotspotText: 'Следующий ракурс ▶' },
                    { pitch: -5, yaw: -90, hotspotText: 'Предыдущий ракурс ◀' }
                ]
            },
            { 
                href: '360_003_0000.jpg',
                title: 'Ракурс 3',
                pitch: 0,
                yaw: 180,
                hotSpots: [
                    { pitch: -5, yaw: 90, hotspotText: 'Следующий ракурс ▶' },
                    { pitch: -5, yaw: -90, hotspotText: 'Предыдущий ракурс ◀' }
                ]
            },
            { 
                href: '360_004_0000.jpg',
                title: 'Ракурс 4',
                pitch: 0,
                yaw: 270,
                hotSpots: [
                    { pitch: -5, yaw: 90, hotspotText: 'Следующий ракурс ▶' },
                    { pitch: -5, yaw: -90, hotspotText: 'Предыдущий ракурс ◀' }
                ]
            }
        ];

        let currentScene = 0;
        let viewer;
        const loader = document.getElementById('loader');
        const sceneIndicator = document.getElementById('scene-indicator');
        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        const hint = document.getElementById('hint');

        // Инициализация
        function init() {
            viewer = new pannellum.Viewer('panorama', {
                default: {
                    firstScene: 0,
                    scenePadding: 0.5
                },
                scenes: {}
            });

            // Добавляем все сцены
            scenes.forEach((scene, index) => {
                viewer.addScene(index, {
                    type: 'equirectangular',
                    panorama: scene.href,
                    pitch: scene.pitch,
                    yaw: scene.yaw,
                    hotSpots: scene.hotSpots.map(hotspot => ({
                        ...hotspot,
                        clickHandlerFunc: () => navigateToScene(getNextSceneIndex(index))
                    }))
                });
            });

            // Загружаем первую сцену
            loadScene(0);

            // Обработчики кнопок
            menuBtn.addEventListener('click', toggleMenu);
            
            // Fallback на случай задержки загрузки
            setTimeout(() => {
                if (!loader.classList.contains('hidden')) {
                    loader.classList.add('hidden');
                }
            }, 5000);
        }

        function loadScene(index) {
            currentScene = index;
            viewer.loadScene(index);
            
            // Обновляем индикатор
            sceneIndicator.textContent = `Ракурс ${index + 1} из ${scenes.length}`;
            
            // Обновляем активную кнопку в меню
            document.querySelectorAll('.menu-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        function prevScene() {
            const newIndex = (currentScene - 1 + scenes.length) % scenes.length;
            loadScene(newIndex);
        }

        function nextScene() {
            const newIndex = (currentScene + 1) % scenes.length;
            loadScene(newIndex);
        }

        function navigateToScene(index) {
            loadScene(index);
        }

        function toggleMenu() {
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        }

        // Показываем подсказку при загрузке
        viewer.on('load', () => {
            loader.classList.add('hidden');
            
            setTimeout(() => {
                hint.textContent = 'Используйте стрелки или меню для навигации между ракурсами';
                hint.classList.add('show');
                setTimeout(() => hint.classList.remove('show'), 3000);
            }, 500);
        });

        // Запускаем
        init();
    </script>
</body>
</html>
