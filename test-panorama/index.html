<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Тест 360° Панорама</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        .loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); color: #fff; z-index: 999; transition: opacity 0.5s; }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .status { margin-top: 1rem; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        Загрузка панорамы…
        <div class="status" id="status"></div>
    </div>
    <div id="panorama"></div>

    <script>
        const statusEl = document.getElementById('status');
        let currentViewer;

        function log(msg) {
            console.log(msg);
            if (statusEl) statusEl.textContent = msg;
        }

        // Проверка существования файла
        fetch('test.jpg')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.blob();
            })
            .then(blob => {
                log('Файл найден, загружаю...');
                
                // Создаём viewer после проверки файла
                currentViewer = pannellum.viewer('panorama', {
                    type: 'equirectangular',
                    panorama: 'test.jpg',
                    autoLoad: true,
                    autoRotate: -2.5,
                    showControls: true,
                    compass: false
                });

                // Скрываем лоадер через 400мс
                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                }, 400);
            })
            .catch(err => {
                log(`Ошибка: ${err.message}`);
                console.error('Не удалось загрузить test.jpg:', err);
                
                // Fallback: пробуем тестовую панораму Pannellum
                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                    currentViewer = pannellum.viewer('panorama', {
                        type: 'equirectangular',
                        panorama: 'https://pannellum.org/documentation/example/pictures/1.jpg',
                        autoLoad: true,
                        autoRotate: -2.5,
                        showControls: true,
                        compass: false
                    });
                }, 1000);
            });

        // Предзагрузка изображения для проверки
        const img = new Image();
        img.onerror = () => log('Ошибка загрузки текстуры');
        img.src = 'test.jpg';
    </script>
</body>
</html>
