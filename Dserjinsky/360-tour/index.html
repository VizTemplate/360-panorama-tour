<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>360° Тур по квартире Дзержинский</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; }
        #panorama { width: 100vw; height: 100vh; }

        /* === Прелоадер === */
        .loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 999;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Спиннер */
        .spinner {
            width: 56px; height: 56px;
            border: 4px solid rgba(233, 69, 96, 0.15);
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Текст статуса */
        .status {
            margin-top: 20px;
            color: #e94560;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }

        /* Прогресс-бар */
        .progress-bar {
            width: 220px; height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            margin-top: 14px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #e94560, #f7a088);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Подсказка */
        .hint {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5); font-size: 14px; letter-spacing: 1px;
            opacity: 0; transition: opacity 1s ease-in;
        }
        .hint.visible { opacity: 1; }

        /* Навигация */
        .nav-panel {
            position: fixed; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 15px;
            border-radius: 8px; z-index: 1000;
        }
        .nav-panel a {
            display: block; color: white; text-decoration: none;
            margin: 5px 0; padding: 5px 10px; border-radius: 4px; transition: background 0.3s;
        }
        .nav-panel a:hover { background: rgba(255, 255, 255, 0.2); }
        .nav-panel a.active { background: rgba(76, 175, 80, 0.8); }
    </style>
</head>
<body>

<!-- Прелоадер -->
<div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="status">Загружаем панораму…</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- Навигация -->
<div class="nav-panel">
    <strong>🏠 Комнаты:</strong><br>
    <a href="#" onclick="changeScene('prikhozhaya')">Прихожая</a>
    <a href="#" onclick="changeScene('kukhnya')">Кухня-гостиная</a>
    <a href="#" onclick="changeScene('detskaya')">Детская</a>
    <a href="#" onclick="changeScene('vanaya')">Ванная</a>
</div>

<!-- Подсказка -->
<div class="hint">🖱️ Вращайте панораму • Кликайте на hotspots для перехода</div>

<!-- Контейнер панорамы -->
<div id="panorama"></div>

<script>
(function() {
    var statusEl = document.getElementById('status');
    var progressFill = document.getElementById('progressFill');
    var loader = document.getElementById('loader');
    var viewer;

    function log(msg) {
        console.log(msg);
        if (statusEl) statusEl.textContent = msg;
    }

    // Конфигурация сцен (комнат) - все переходы через прихожую
    var scenes = {
        'prikhozhaya': {
            panorama: 'prikhozhaya.jpg',
            hotSpots: [
                { type: 'info', pitch: 0, yaw: -45, text: '🚪 Кухня →', clickHandlerFunc: function() { changeScene('kukhnya'); } },
                { type: 'info', pitch: 0, yaw: 45, text: '🚪 Детская →', clickHandlerFunc: function() { changeScene('detskaya'); } },
                { type: 'info', pitch: 0, yaw: 135, text: '🚪 Ванная →', clickHandlerFunc: function() { changeScene('vanaya'); } }
            ]
        },
        'kukhnya': {
            panorama: 'kukhnya.jpg',
            hotSpots: [
                { type: 'info', pitch: 0, yaw: -90, text: '🚪 Прихожая →', clickHandlerFunc: function() { changeScene('prikhozhaya'); } }
            ]
        },
        'detskaya': {
            panorama: 'detskaya.jpg',
            hotSpots: [
                { type: 'info', pitch: 0, yaw: -90, text: '🚪 Прихожая →', clickHandlerFunc: function() { changeScene('prikhozhaya'); } }
            ]
        },
        'vanaya': {
            panorama: 'vanaya.jpg',
            hotSpots: [
                { type: 'info', pitch: 0, yaw: -90, text: '🚪 Прихожая →', clickHandlerFunc: function() { changeScene('prikhozhaya'); } }
            ]
        }
    };

    // Инициализация Pannellum
    viewer = pannellum.viewer('panorama', {
        default: {
            firstScene: 'prikhozhaya',
            autoLoad: true,
            autoRotate: -2
        },
        scenes: scenes
    });

    // Скрываем лоадер после загрузки первой сцены
    viewer.addEventListener('load', function() {
        setTimeout(function() {
            loader.classList.add('hidden');
            var hint = document.querySelector('.hint');
            if (hint) {
                setTimeout(function() { hint.classList.add('visible'); }, 100);
            }
        }, 400);
    });

    // Функция смены сцены
    window.changeScene = function(sceneId) {
        viewer.loadScene(sceneId);
        
        // Обновляем активную кнопку в навигации
        document.querySelectorAll('.nav-panel a').forEach(function(link) {
            link.classList.remove('active');
        });
        event.target.classList.add('active');
    };

    // Устанавливаем первую сцену активной
    document.querySelector('.nav-panel a:first-child').classList.add('active');

    // Fallback: если загрузка не произошла за 15 секунд, всё равно скрываем
    setTimeout(function() {
        if (!loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
        }
    }, 15000);
})();
</script>
</body>
</html>
