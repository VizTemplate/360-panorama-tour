<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="user-scalable=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
    <title>360° Тур по квартире Дзержинский</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        #panorama {
            width: 100%;
            height: 100vh;
        }
        body { margin: 0; padding: 0; overflow: hidden; }
        
        /* Навигация */
        .nav-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
        }
        .nav-panel a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .nav-panel a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .nav-panel a.active {
            background: rgba(76, 175, 80, 0.8);
        }
        
        /* Прелоадер */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .preloader-text {
            color: white;
            font-size: 18px;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }
        
        /* Подсказка */
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<!-- Навигация -->
<div class="nav-panel">
    <strong>🏠 Комнаты:</strong><br>
    <a href="#" onclick="changeScene('prikhozhaya')">Прихожая</a>
    <a href="#" onclick="changeScene('kukhnya')">Кухня-гостиная</a>
    <a href="#" onclick="changeScene('detskaya')">Детская</a>
    <a href="#" onclick="changeScene('vanaya')">Ванная</a>
</div>

<!-- Прелоадер -->
<div id="preloader" class="preloader">
    <div class="spinner"></div>
    <div class="preloader-text">Загрузка панорамы...</div>
</div>

<!-- Подсказка -->
<div class="hint">🖱️ Вращайте панораму • Кликайте на hotspots для перехода</div>

<script>
// Конфигурация сцен (комнат) - все переходы через приховую
var scenes = {
    'prikhozhaya': {
        panorama: 'prikhozhaya.jpg',
        hotSpots: [
            // Дверь в кухню-гостиную
            {
                type: 'info',
                pitch: 0,
                yaw: -45,
                text: '🚪 Кухня →',
                clickHandlerFunc: function() { changeScene('kukhnya'); }
            },
            // Дверь в детскую
            {
                type: 'info',
                pitch: 0,
                yaw: 45,
                text: '🚪 Детская →',
                clickHandlerFunc: function() { changeScene('detskaya'); }
            },
            // Дверь в ванную
            {
                type: 'info',
                pitch: 0,
                yaw: 135,
                text: '🚪 Ванная →',
                clickHandlerFunc: function() { changeScene('vanaya'); }
            }
        ]
    },
    'kukhnya': {
        panorama: 'kukhnya.jpg',
        hotSpots: [
            // Дверь в прихожую
            {
                type: 'info',
                pitch: 0,
                yaw: -90,
                text: '🚪 Прихожая →',
                clickHandlerFunc: function() { changeScene('prikhozhaya'); }
            }
        ]
    },
    'detskaya': {
        panorama: 'detskaya.jpg',
        hotSpots: [
            // Дверь в прихожую
            {
                type: 'info',
                pitch: 0,
                yaw: -90,
                text: '🚪 Прихожая →',
                clickHandlerFunc: function() { changeScene('prikhozhaya'); }
            }
        ]
    },
    'vanaya': {
        panorama: 'vanaya.jpg',
        hotSpots: [
            // Дверь в прихожую
            {
                type: 'info',
                pitch: 0,
                yaw: -90,
                text: '🚪 Прихожая →',
                clickHandlerFunc: function() { changeScene('prikhozhaya'); }
            }
        ]
    }
};

// Инициализация Pannellum
var viewer = pannellum.viewer('panorama', {
    default: {
        firstScene: 'prikhozhaya',
        autoLoad: true,
        autoRotate: -2
    },
    scenes: scenes
});

// Скрываем прелоадер после загрузки панорамы
viewer.addEventListener('load', function() {
    var preloader = document.getElementById('preloader');
    if (preloader) {
        setTimeout(function() {
            preloader.classList.add('hidden');
            setTimeout(function() {
                preloader.style.display = 'none';
            }, 500);
        }, 300);
    }
});

// Функция смены сцены
function changeScene(sceneId) {
    viewer.loadScene(sceneId);
    
    // Обновляем активную кнопку в навигации
    document.querySelectorAll('.nav-panel a').forEach(function(link) {
        link.classList.remove('active');
    });
    event.target.classList.add('active');
}

// Устанавливаем первую сцену активной
document.querySelector('.nav-panel a:first-child').classList.add('active');
</script>

</body>
</html>
