<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>360° Панорама — Кухня-гостиная</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; }
        #panorama { width: 100vw; height: 100vh; }

        /* === Прелоадер === */
        .loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 999;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Спиннер */
        .spinner {
            width: 56px; height: 56px;
            border: 4px solid rgba(233, 69, 96, 0.15);
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Текст статуса */
        .status {
            margin-top: 20px;
            color: #e94560;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 1; }
        }

        /* Прогресс-бар */
        .progress-bar {
            width: 220px; height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            margin-top: 14px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #e94560, #f7a088);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Подсказка */
        .hint {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5); font-size: 14px; letter-spacing: 1px;
            opacity: 0; transition: opacity 1s ease-in;
        }
        .hint.visible { opacity: 1; }
    </style>
</head>
<body>

<!-- Прелоадер -->
<div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="status">Загружаем панораму…</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- Контейнер панорамы -->
<div id="panorama"></div>

<script>
(function() {
    var progressFill = document.getElementById('progressFill');
    var loader = document.getElementById('loader');
    var viewer;

    function onProgress(progress) {
        var pct = Math.round(progress * 100);
        if (progressFill) {
            progressFill.style.width = pct + '%';
        }
    }

    viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: '360_1.jpg',
        autoLoad: true,
        autoRotate: -2.5,
        showControls: true,
        compass: false,
        progressHandler: onProgress
    });

    viewer.on('load', function() {
        setTimeout(function() {
            loader.classList.add('hidden');
            var hint = document.createElement('div');
            hint.className = 'hint';
            hint.textContent = '↔ Вращайте панораму мышью';
            document.body.appendChild(hint);
            setTimeout(function() { hint.classList.add('visible'); }, 800);
        }, 500);
    });

    // Fallback: если загрузка не произошла за 15 секунд, всё равно скрываем
    setTimeout(function() {
        if (!loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
        }
    }, 15000);
})();
</script>
</body>
</html>
